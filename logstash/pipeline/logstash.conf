input {
    file {
        path => "/usr/share/logstash/logs/*.json"
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/springboot-sincedb"
        discover_interval => 5
        codec => json
    }
}

output {
    elasticsearch {
        hosts => "elasticsearch:9200"
        index => "springboot-%{app}"
    }
}