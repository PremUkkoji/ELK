services:

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.3.3
        container_name: elastic_SB
        environment:
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
            - "discovery.type=single-node"
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elastic_data:/usr/share/elasticsearch/data
        networks:
            - elastic

    kibana:
        image: docker.elastic.co/kibana/kibana:8.3.3
        container_name: kibana_SB
        ports:
            - "5601:5601"
        environment:
            ELASTICSEARCH_URL: http://elasticsearch:9200
            ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
        depends_on:
            - elasticsearch
        networks:
            - elastic

    logstash:
        image: docker.elastic.co/logstash/logstash:8.3.3
        container_name: logstash_SB
        volumes:
            - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
            - ./springboot-logger/logs:/usr/share/logstash/logs:ro
            - logstash_data:/usr/share/logstash/data
        ports:
            - "9600:9600"
        environment:
            LS_JAVA_OPTS: "-Xmx256m -Xms256m"
        networks:
            - elastic
        depends_on:
            - elasticsearch

    springboot-logger:
        build:
            context: ./springboot-logger
        environment:
            LOG_DIR: /var/log/springboot
        volumes:
            - ./springboot-logger/logs:/var/log/springboot
        depends_on:
            - logstash
        networks:
            - elastic

networks:
    elastic:
        driver: bridge

volumes:
    elastic_data:
        driver: local
    logstash_data:
        driver: local