apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-deployment
  namespace: elk-k8s
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.3.3
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch-service:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: XPACK_SECURITY_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5601
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
  namespace: elk-k8s
spec:
  selector:
    app: kibana
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 5601
      targetPort: http
      nodePort: 30601